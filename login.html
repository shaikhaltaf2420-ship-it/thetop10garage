<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login | Speed Bike Garage</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-dark min-vh-100 d-flex flex-column justify-content-between">

  <!-- Simple Header -->
  <nav class="navbar navbar-dark bg-dark border-bottom border-secondary py-3">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="fa-solid fa-motorcycle text-danger"></i> SPEED<span class="text-danger">BIKE</span> GARAGE
      </a>
      <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill"><i class="fa-solid fa-arrow-left me-1"></i> Back to Website</a>
    </div>
  </nav>

  <!-- Login Card Container -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden bg-white">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <div class="rounded-circle bg-danger bg-opacity-10 text-danger d-inline-flex align-items-center justify-content-center p-3 mb-2" style="width:60px;height:60px;">
                <i class="fa-solid fa-user-lock fa-2x"></i>
              </div>
              <h4 class="fw-bold">Customer Login</h4>
              <p class="text-muted small">Sign in to track your service bookings</p>
            </div>

            <form id="htmlLoginForm" class="needs-validation" novalidate>
              <div class="mb-3">
                <label class="form-label fw-semibold small">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-secondary"></i></span>
                  <input type="email" id="loginEmail" class="form-control bg-light border-start-0" placeholder="e.g. rahul@example.com" required>
                </div>
              </div>

              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                  <label class="form-label fw-semibold small mb-0">Password</label>
                  <a href="#" class="text-danger small text-decoration-none">Forgot?</a>
                </div>
                <div class="input-group mt-1">
                  <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-secondary"></i></span>
                  <input type="password" id="loginPass" class="form-control bg-light border-start-0 border-end-0" placeholder="••••••••" required>
                  <button type="button" class="btn btn-light border-start-0 toggle-password" data-target="#loginPass"><i class="fa-solid fa-eye text-secondary"></i></button>
                </div>
              </div>

              <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe">
                <label class="form-check-label small text-secondary" for="rememberMe">Remember me</label>
              </div>

              <button type="submit" class="btn btn-danger w-100 py-2 rounded-pill fw-bold"><i class="fa-solid fa-right-to-bracket me-2"></i>Sign In</button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
              <p class="small text-secondary mb-1">Don't have an account? <a href="register.html" class="text-danger fw-semibold">Register Now</a></p>
              <p class="small text-secondary mb-0"><i class="fa-solid fa-user-gear text-danger me-1"></i>Are you an Admin? <a href="admin/login.php" class="text-danger fw-semibold">Admin Login</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-black text-secondary text-center py-3 small">
    &copy; 2026 Speed Bike Garage. All Rights Reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/script.js"></script>
  <script>
    document.getElementById('htmlLoginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      if (this.checkValidity()) {
        alert('Login Successful! Redirecting to booking page...');
        window.location.href = 'booking.html';
      }
    });
  </script>
</body>
</html>
