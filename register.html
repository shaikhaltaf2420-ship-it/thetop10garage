<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Registration | Speed Bike Garage</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-dark min-vh-100 d-flex flex-column justify-content-between">

  <!-- Header -->
  <nav class="navbar navbar-dark bg-dark border-bottom border-secondary py-3">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="fa-solid fa-motorcycle text-danger"></i> SPEED<span class="text-danger">BIKE</span> GARAGE
      </a>
      <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill"><i class="fa-solid fa-arrow-left me-1"></i> Back to Website</a>
    </div>
  </nav>

  <!-- Register Card -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden bg-white">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <div class="rounded-circle bg-danger bg-opacity-10 text-danger d-inline-flex align-items-center justify-content-center p-3 mb-2" style="width:60px;height:60px;">
                <i class="fa-solid fa-user-plus fa-2x"></i>
              </div>
              <h4 class="fw-bold">Create Customer Account</h4>
              <p class="text-muted small">Join Speed Bike Garage for seamless service tracking</p>
            </div>

            <form id="htmlRegisterForm" class="needs-validation" novalidate>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label fw-semibold small">Full Name <span class="text-danger">*</span></label>
                  <input type="text" class="form-control bg-light" placeholder="e.g. Rahul Sharma" required>
                </div>

                <div class="col-md-6">
                  <label class="form-label fw-semibold small">Phone Number <span class="text-danger">*</span></label>
                  <input type="tel" class="form-control bg-light" placeholder="e.g. 9876543210" required pattern="[0-9]{10}">
                </div>

                <div class="col-md-12">
                  <label class="form-label fw-semibold small">Email Address <span class="text-danger">*</span></label>
                  <input type="email" class="form-control bg-light" placeholder="e.g. rahul@example.com" required>
                </div>

                <div class="col-md-6">
                  <label class="form-label fw-semibold small">Password <span class="text-danger">*</span></label>
                  <input type="password" id="regPass" class="form-control bg-light" placeholder="Min. 6 characters" required minlength="6">
                </div>

                <div class="col-md-6">
                  <label class="form-label fw-semibold small">Confirm Password <span class="text-danger">*</span></label>
                  <input type="password" id="regConfirmPass" class="form-control bg-light" placeholder="Repeat password" required minlength="6">
                </div>

                <div class="col-md-12">
                  <label class="form-label fw-semibold small">Address (Optional)</label>
                  <input type="text" class="form-control bg-light" placeholder="e.g. Flat 101, Green Heights, Ahmedabad">
                </div>

                <div class="col-md-12 mt-4">
                  <button type="submit" class="btn btn-danger w-100 py-2.5 rounded-pill fw-bold"><i class="fa-solid fa-user-check me-2"></i>Create My Account</button>
                </div>
              </div>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
              <p class="small text-secondary mb-0">Already have an account? <a href="login.html" class="text-danger fw-semibold">Sign In Here</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-black text-secondary text-center py-3 small">
    &copy; 2026 Speed Bike Garage. All Rights Reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/script.js"></script>
  <script>
    document.getElementById('htmlRegisterForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const p1 = document.getElementById('regPass').value;
      const p2 = document.getElementById('regConfirmPass').value;
      if (p1 !== p2) {
        alert('Passwords do not match!');
        return;
      }
      if (this.checkValidity()) {
        alert('Account created successfully! Please sign in.');
        window.location.href = 'login.html';
      }
    });
  </script>
</body>
</html>
